services:
  postgres:
    image: 'postgres:17'
    environment:
      - POSTGRES_DB=cargoflow
      - POSTGRES_USER=cargoflow
      - POSTGRES_PASSWORD=cargoflow
    ports:
      - '5433:5432'    # exposed for jOOQ codegen
    volumes:
      - cargoflow_pg_data:/var/lib/postgresql/data  # persists data across restarts

  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:9.0.0'
    environment:
      - discovery.type=single-node      # single-node mode (local dev)
      - xpack.security.enabled=false    # disable ES auth (local dev)
      - ES_JAVA_OPTS=-Xms512m -Xmx512m  # cap memory usage
    ports:
      - '9201:9200'    # ES REST API (9201 to avoid clashing with other projects)

volumes:
  cargoflow_pg_data:   # named volume — postgres data persists across restarts
